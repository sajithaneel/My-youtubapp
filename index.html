<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Liker</title>
<style>
  :root { --bg:#ffffff; --fg:#1a1a1a; --card:#f3f3f3; --accent:#e62117; --muted:#666; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#f1f1f1; --card:#1f1f1f; --accent:#ff4e45; --muted:#aaa; color-scheme: dark; }
  }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg);
         font-family:system-ui,sans-serif; display:flex; justify-content:center; }
  .box { width:100%; max-width:460px; background:var(--card); padding:20px; border-radius:16px; }
  h2 { margin-top:0; }
  textarea { width:100%; box-sizing:border-box; padding:12px; border-radius:10px; min-height:180px;
             border:1px solid var(--muted); background:var(--bg); color:var(--fg); font-size:15px; }
  button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:10px;
           background:var(--accent); color:#fff; font-size:16px; }
  button:disabled { opacity:.5; }
  #status { margin-top:14px; color:var(--muted); font-size:14px; line-height:1.6; word-break:break-all; }
</style>
</head>
<body>
<div class="box">
  <h2>👍 YouTube Liker</h2>
  <button id="login">1. Google login</button>
  <textarea id="links" placeholder="YouTube links paste කරන්න (එක line එකකට එක link එකක්)" style="margin-top:12px"></textarea>
  <button id="like">2. Like කරන්න</button>
  <div id="status"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  const CLIENT_ID = "1091487239681-23gbcjug1o4mtqs7949s1prn357ne6c1.apps.googleusercontent.com";
  const SCOPE = "https://www.googleapis.com/auth/youtube.force-ssl";
  let token = null;
  const status = document.getElementById("status");
  const likeBtn = document.getElementById("like");

  function getVideoIds(text) {
    const re = /(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/g;
    const ids = [];
    let m;
    while ((m = re.exec(text)) !== null) {
      if (!ids.includes(m[1])) ids.push(m[1]);
    }
    return ids;
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  document.getElementById("login").onclick = () => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: (resp) => {
        if (resp.access_token) { token = resp.access_token; status.textContent = "✅ Login උනා"; }
        else status.textContent = "Login error";
      },
    });
    client.requestAccessToken();
  };

  likeBtn.onclick = async () => {
    if (!token) { status.textContent = "මුලින් login වෙන්න"; return; }
    const ids = getVideoIds(document.getElementById("links").value);
    if (ids.length === 0) { status.textContent = "Links හොයාගන්න බැරි උනා"; return; }

    likeBtn.disabled = true;
    const lines = [];
    let ok = 0;
    for (let i = 0; i < ids.length; i++) {
      lines.push(`${i + 1}. ${ids[i]} ...`);
      status.innerHTML = lines.join("<br>");
      try {
        const r = await fetch(
          `https://www.googleapis.com/youtube/v3/videos/rate?id=${ids[i]}&rating=like`,
          { method: "POST", headers: { Authorization: "Bearer " + token } }
        );
        if (r.status === 204) { ok++; lines[i] = `${i + 1}. ${ids[i]} 👍`; }
        else lines[i] = `${i + 1}. ${ids[i]} ❌ (${r.status})`;
      } catch (e) {
        lines[i] = `${i + 1}. ${ids[i]} ❌ ${e.message}`;
      }
      status.innerHTML = lines.join("<br>");
      await sleep(1000);
    }
    status.innerHTML = lines.join("<br>") + `<br><b>${ok}/${ids.length} like කළා</b>`;
    likeBtn.disabled = false;
  };
</script>
</body>
</html>
